plugins {
    id 'java'
    id 'application'
    // Handles JavaFX module-path/dependencies automatically (no manual VM args).
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ir.ac.kntu'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

// Force UTF-8 for compilation. Without this, javac uses the platform default
// (Cp1252 on Windows), which mangles non-ASCII source characters (e.g. the
// em-dash in window titles) into mojibake at compile time.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.base']
}

application {
    // GUI is now the default entry point. The original CLI is still runnable
    // via the `runCli` task defined below.
    mainClass = 'ir.ac.kntu.gui.GuiLauncher'
    applicationDefaultJvmArgs = []
}

run {
    // Use PostgreSQL from docker-compose (port 45432 mapped from 5432).
    environment 'JDBC_URL', System.getenv('JDBC_URL') ?: 'jdbc:postgresql://localhost:45432/lms'
    environment 'JDBC_USER', System.getenv('JDBC_USER') ?: 'lms'
    environment 'JDBC_PASSWORD', System.getenv('JDBC_PASSWORD') ?: 'lms'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.4'
    testRuntimeOnly 'com.h2database:h2:2.2.224'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testfx:testfx-junit5:4.0.16-alpha'
    testImplementation 'org.testfx:testfx-core:4.0.16-alpha'
    // Headless rendering backend for TestFX. The 17.0.x line is compiled for
    // Java 17 (this project's toolchain); the 21.x jar is Java-21 bytecode and
    // fails to load here. It renders GUI tests to an offscreen Monocle screen
    // instead of a real window — no stolen focus, no cursor movement.
    testImplementation 'org.testfx:openjfx-monocle:17.0.10'
    testImplementation 'net.sourceforge.pmd:pmd-java:6.55.0'
    testImplementation 'com.puppycrawl.tools:checkstyle:10.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep the original command-line interface available:  ./gradlew runCli
tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the original command-line LMS (ir.ac.kntu.Main).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ir.ac.kntu.Main'
    standardInput = System.in
}

jar {
    manifest {
        attributes 'Main-Class': 'ir.ac.kntu.gui.GuiLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Headed test task: runs the two most important GUI tests with a real JavaFX
// window and the real OS robot. No Monocle/headless properties. Skipped
// automatically when -PskipGuiTests is set (same as CI behaviour).
tasks.register('testHeaded', Test) {
    useJUnitPlatform()
    environment 'JDBC_URL', 'jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1'
    environment 'JDBC_USER', 'sa'
    environment 'JDBC_PASSWORD', ''
    filter {
        includeTestsMatching 'ir.ac.kntu.gui.BorrowReserveReturnE2ETest'
        includeTestsMatching 'ir.ac.kntu.gui.SignupFlowTest'
    }
    onlyIf { !project.hasProperty('skipGuiTests') }
}

test {
    useJUnitPlatform()
    environment 'JDBC_URL', 'jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1'
    environment 'JDBC_USER', 'sa'
    environment 'JDBC_PASSWORD', ''

    // Run TestFX headless via Monocle: JavaFX renders to a virtual offscreen
    // screen and TestFX uses the in-JVM Glass/Monocle robot instead of the real
    // OS mouse/keyboard. This stops the GUI tests from opening a window behind
    // the editor, moving the developer's cursor, or stealing focus — which was
    // also the source of the focus-contention flakiness on Windows.
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
    systemProperty 'prism.text', 't2k'
    systemProperty 'java.awt.headless', 'true'

    // The two headed tests run in the testHeaded task instead (real window).
    filter {
        excludeTestsMatching 'ir.ac.kntu.gui.BorrowReserveReturnE2ETest'
        excludeTestsMatching 'ir.ac.kntu.gui.SignupFlowTest'
    }
    // CI (university GitLab shell runner) cannot run TestFX GUI tests, so they
    // are skipped there via `-PskipGuiTests`. Locally, `./gradlew clean test`
    // still runs everything including the GUI tests (headed).
    if (project.hasProperty('skipGuiTests')) {
        filter {
            excludeTestsMatching 'ir.ac.kntu.gui.*'
        }
    }
    dependsOn testHeaded
}
