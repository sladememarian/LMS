stages:
  - test

java:
  stage: test
  image: openjdk:17
  tags:
    - local
  script:
    # GUI (TestFX) tests need a display and fail on the shared shell runner;
    # -PskipGuiTests excludes them so only unit + style tests run here.
    - ./gradlew clean test -PskipGuiTests
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test